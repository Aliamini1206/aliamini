    <div class="card">
        <!-- آیکون تزئینی -->
        <div class="emoji-badge">✨🌐✨</div>

        <!-- تیتر اصلی با افکت گرادیان -->
        <h1>
            <span class="highlight">سلام دنیا!</span>
        </h1>

        <!-- متن معرفی -->
        <p>
            این یک کد <strong>HTML ساده</strong> و واکنش‌گراست<br>
            با استایل مدرن و راست‌چین
        </p>

        <!-- نمایش تاریخ شمسی (به صورت داینامیک با جاوااسکریپت) -->
        <div class="date-box" id="dateDisplay">
            <span>📅</span>
            <span id="persianDate">در حال بارگذاری...</span>
        </div>

        <!-- دکمه تعاملی -->
        <button class="btn" id="helloBtn">
            🖐️ کلیک کن
        </button>

        <!-- پانوشت -->
        <div class="footer-note">
            ساخته شده با <code>&lt;html&gt;</code> ، <code>&lt;css&gt;</code> و <code>&lt;js&gt;</code> — کد ساده و کامل
        </div>
    </div>

    <script>
        (function() {
            // ---------- نمایش تاریخ شمسی به صورت داینامیک ----------
            const persianDateSpan = document.getElementById('persianDate');
            
            // تابع برای تبدیل تاریخ میلادی به شمسی
            function getPersianDate() {
                try {
                    const now = new Date();
                    // استفاده از API بین‌المللی برای تقویم شمسی (fa-IR)
                    const options = { 
                        year: 'numeric', 
                        month: 'long', 
                        day: 'numeric',
                        weekday: 'long'
                    };
                    // locale 'fa-IR' تقویم شمسی را پشتیبانی می‌کند
                    return new Intl.DateTimeFormat('fa-IR', options).format(now);
                } catch (e) {
                    // در صورت عدم پشتیبانی، تاریخ میلادی ساده برمیگردانیم
                    const d = new Date();
                    return d.toLocaleDateString('fa-IR');
                }
            }

            // به‌روزرسانی تاریخ
            if (persianDateSpan) {
                persianDateSpan.textContent = getPersianDate();
            }

            // ---------- دکمه تعاملی: پیام خوش‌آمدگویی ----------
            const btn = document.getElementById('helloBtn');
            btn.addEventListener('click', function() {
                // تغییر متن دکمه به صورت موقت
                const originalText = btn.innerHTML;
                btn.innerHTML = '🎉 خوش آمدید!';
                btn.style.background = '#1a5e3a';  // تغییر رنگ موقت
                
                // نمایش یک پیام ساده
                alert('سلام! از اینکه این کد ساده را اجرا کردید سپاسگزارم 🌟');
                
                // بازگرداندن دکمه به حالت اول پس از ۱.۵ ثانیه
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = '#0b2b5c';
                }, 1500);
            });

            // ---------- یک افکت کوچک: تغییر جزئی در ظاهر هنگام لود ----------
            console.log('کد HTML ساده با موفقیت اجرا شد ✅');
        })();
    </script>
</body>
